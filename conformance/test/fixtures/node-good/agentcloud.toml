[app]
name = "starter"

[service.web]
port = 8080
dev = "npm run dev"
health = "/api/health"

[service.worker]
command = "node server/worker.ts"
dev = "node --watch server/worker.ts"

[data.db]
env = "DATABASE_URL"
migrations = "migrations/"
seed = "seed.sql"

[[check.smoke]]
name  = "one note per title, even when racing"
steps = [
  "SIGN IN racer-{run}@example.test",
  "POST /api/notes {title: 'Hello {run}'} -> 201|409 x10",
  "GET /api/notes -> 200",
]

[[check.invariant]]
name = "a title once per person"
sql  = "SELECT user_id, title FROM notes GROUP BY user_id, title HAVING count(*) > 1"
